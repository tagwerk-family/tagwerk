# The app (wall and phone in one) as a built single-page app next to Laravel.
#
#   /            app      (packages/app/.output/public)
#   anything else Laravel (/api, /broadcasting, /admin, /auth/…)
#
# Serves the state of the last `pnpm build`. The dev server on 3000 remains
# for work on the interface.
#
# The rules stand one by one instead of as `location /`: DDEV's own config
# already uses that block for Laravel. Paths without variables, because nginx
# resolves `alias` with variables differently.

# --- App -------------------------------------------------------------------

location = / {
    root /var/www/html/apps/platform/frontend/packages/app/.output/public;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    # The app's Content Security Policy, written by the post-start hook in
    # config.yaml (`fahoba:csp`). A glob, so nginx starts without it.
    include /var/www/html/apps/platform/storage/framework/csp-app*.conf;
}

# Service worker and manifest must apply right after a build.
location = /sw.js {
    root /var/www/html/apps/platform/frontend/packages/app/.output/public;
    add_header Cache-Control "no-cache";
}

# nginx does not know the extension and would send application/octet-stream.
location = /manifest.webmanifest {
    root /var/www/html/apps/platform/frontend/packages/app/.output/public;
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
}

# SVG for the browser tab, PNGs for installing: Chrome wants those. The
# badge is the notification's mark in the status bar. theme.js sets light
# or dark before the first paint.
location ~ ^/(icon(\.svg|-(192|512|maskable-512)\.png)|badge-96\.png|theme\.js)$ {
    root /var/www/html/apps/platform/frontend/packages/app/.output/public;
}

# A community frontend's built files (deploy/nginx.conf, FAHOBA_FRONTEND).
location ^~ /assets/ {
    root /var/www/html/apps/platform/frontend/packages/app/.output/public;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# File names carry a checksum and change with every build.
location ^~ /_nuxt/ {
    root /var/www/html/apps/platform/frontend/packages/app/.output/public;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
# Task and reward icons; missing ones 404 so the app falls back to the emoji.
location ^~ /emoji/ {
    root /var/www/html/apps/platform/public;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
}

# Exception: builds/latest.json keeps its name and announces the new build.
location ^~ /_nuxt/builds/ {
    root /var/www/html/apps/platform/frontend/packages/app/.output/public;
    add_header Cache-Control "no-cache";
}
