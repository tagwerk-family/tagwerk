name: Build

# Fahoba serves dist/ as it is, so the committed build must match the
# sources: this fails when someone changed src/ and forgot `npm run build`.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: git diff --exit-code -- dist
