name: Tests

# Every push and pull request; image.yml runs it again before publishing.
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: PHPUnit and Pint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Real PostgreSQL, never SQLite: the scopes, check constraints and
    # zone handling the tests guard only exist there.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
          POSTGRES_DB: fahoba_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U db -d fahoba_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/platform
    env:
      # phpunit.xml names the DDEV host "db"; an environment value wins.
      DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@4424c9aab975b57bd706ee5a39c6b4334d6e4f60 # 2.40.0
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, gd, exif, zip, bcmath, pcntl
          coverage: none
          tools: composer:v2
      - name: Composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('apps/platform/composer.lock') }}
          restore-keys: composer-
      - run: composer install --no-interaction --no-progress --prefer-dist
      # Only a key, like DDEV's .env has no Reverb keys: .env.example's
      # development values would leak into tests that set their own.
      - run: echo "APP_KEY=base64:$(openssl rand -base64 32)" > .env
      - run: ./vendor/bin/pint --test
      - run: php artisan test

  frontend:
    name: Vitest, type check and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/platform/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/platform/frontend/pnpm-lock.yaml
      # .npmrc points the store at DDEV's cache volume, which is not here.
      - run: rm .npmrc && pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      # The image build only reports this (its frontend is build tools only); here it fails.
      - run: pnpm audit --prod
