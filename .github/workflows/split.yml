name: Split

# A release tag (v1.2.3) pushes every package under apps/platform/packages
# and apps/platform/plugins to its own read-only repository,
# <SPLIT_OWNER>/fahoba-<name>, and tags it with the package's version.
# Packagist follows those repositories. Needs the repository variable
# SPLIT_OWNER (defaults to this repository's owner) and the secret
# SPLIT_TOKEN (contents: write on the split repositories). The npm job
# publishes @fahoba/client (packages/client) through npm's trusted
# publishing: no token, npmjs.com trusts this workflow file.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  split:
    name: Split packages
    needs: tests
    # By hand only from a tag: a branch would land on the split repos' main.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Otherwise checkout's header with this repository's read token
          # is sent ahead of SPLIT_TOKEN, and every push is refused.
          persist-credentials: false
      - name: Split and push
        env:
          SPLIT_OWNER: ${{ vars.SPLIT_OWNER || github.repository_owner }}
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: .github/scripts/split-packages.sh

  npm:
    name: Publish @fahoba/client
    needs: tests
    # Also by hand from master: it publishes only a version npm lacks.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/platform/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # .npmrc points the store at DDEV's cache volume, which is not here.
      - run: rm .npmrc && pnpm install --frozen-lockfile --filter @fahoba/client
      - run: pnpm --filter @fahoba/client build
      # Like the split: a version npm has already is left alone, so raise
      # packages/client/package.json's version to publish anew. pnpm packs
      # (it applies publishConfig.exports, npm would not); npm publishes,
      # because it speaks the OIDC exchange of trusted publishing.
      - name: Publish when the version is new
        working-directory: apps/platform/frontend/packages/client
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@fahoba/client@$version" version >/dev/null 2>&1; then
            echo "@fahoba/client $version is published already."
          else
            pnpm pack --pack-destination "$RUNNER_TEMP"
            npm publish "$RUNNER_TEMP"/fahoba-client-"$version".tgz --access public
          fi
