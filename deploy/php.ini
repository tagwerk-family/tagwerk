; Production PHP settings for Fahoba.

expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M

; Photos and avatars are uploaded through the admin panel.
upload_max_filesize = 20M
post_max_size = 25M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The code never changes inside a running container.
opcache.validate_timestamps = 0
