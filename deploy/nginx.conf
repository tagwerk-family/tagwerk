# One origin for everything, like in development (.ddev/nginx/fahoba-apps.conf):
#
#   /            app, wall and phone in one (/var/www/app — the official one,
#                or the package FAHOBA_FRONTEND names)
#   /app, /apps  Reverb, if its container runs
#   anything else Laravel (/api, /broadcasting, /admin, /auth/…)
#
# TLS ends at Traefik; this server speaks plain HTTP.

server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 25m;
    server_tokens off;

    # Resolve the Reverb container lazily: without the realtime profile it
    # does not exist, and a static upstream would stop nginx from starting.
    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/security-headers.conf;

    # --- App -------------------------------------------------------------------

    location = / {
        root /var/www/app;
        try_files /index.html =404;
        include /etc/nginx/security-headers.conf;
        # Written by the entrypoint (`fahoba:csp`); Laravel sets its own.
        include /etc/nginx/csp.conf;
        add_header Cache-Control "no-cache";
    }

    # Service worker and manifest must apply right after a deployment.
    location = /sw.js {
        root /var/www/app;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        root /var/www/app;
        types { }
        default_type application/manifest+json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # SVG for the browser tab, PNGs for installing: Chrome wants those. The
    # badge is the notification's mark in the status bar. theme.js sets light
    # or dark before the first paint.
    location ~ ^/(icon(\.svg|-(192|512|maskable-512)\.png)|badge-96\.png|theme\.js)$ {
        root /var/www/app;
    }

    # A community frontend (FAHOBA_FRONTEND) keeps its built files here,
    # Vite's default; they carry a checksum too.
    location ^~ /assets/ {
        root /var/www/app;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # File names carry a checksum and change with every build.
    location ^~ /_nuxt/ {
        root /var/www/app;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Exception: builds/latest.json keeps its name and announces the new build.
    location ^~ /_nuxt/builds/ {
        root /var/www/app;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # --- Reverb ----------------------------------------------------------------

    # /app: the browsers' WebSockets. /apps: Laravel publishing events.
    location ~ ^/apps?/ {
        set $reverb http://reverb:8080;
        proxy_pass $reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # --- Laravel ---------------------------------------------------------------

    # Task and reward icons (public/emoji). A missing one answers 404 instead
    # of Laravel: the app then shows the plain emoji. A week, because a
    # regenerated set keeps its file names.
    location ^~ /emoji/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
